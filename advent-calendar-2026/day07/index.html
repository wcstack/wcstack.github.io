<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>収支</title>
  <link rel="stylesheet" href="../tax.css">
  <script type="module" src="https://esm.run/@wcstack/state@4.31.0/auto"></script>
</head>
<body>

<wcs-state src="./state.js"></wcs-state>

<div class="page">
  <header>
    <h1>収支</h1>
  </header>

  <div class="layout">
    <main>
      <section class="card">
        <h2>収入金額</h2>
        <div class="table-scroll">
          <table class="rows" id="incomes">
            <thead>
              <tr>
                <th scope="col">科目</th>
                <th scope="col" class="num">金額（円）</th>
                <th scope="col" class="num">構成比</th>
                <th scope="col"><span class="visually-hidden">操作</span></th>
              </tr>
            </thead>
            <tbody>
              <template data-wcs="for: incomes">
                <tr>
                  <td><input type="text" aria-label="収入の科目" data-wcs="value: .label"></td>
                  <td class="num"><input type="number" min="0" step="1" aria-label="収入の金額" data-wcs="value|number: .amount"></td>
                  <td class="num" data-wcs="textContent: .share|percent(1)"></td>
                  <td><button type="button" data-wcs="onclick: removeIncome">削除</button></td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <th scope="row">合計</th>
                <td class="num"><span id="income-total" data-wcs="textContent: incomeTotal|locale"></span> 円</td>
                <td></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <button type="button" class="add-row" data-wcs="onclick: addIncome">収入の行を追加</button>
      </section>

      <section class="card">
        <h2>必要経費</h2>
        <div class="table-scroll">
          <table class="rows" id="expenses">
            <thead>
              <tr>
                <th scope="col">科目</th>
                <th scope="col" class="num">金額（円）</th>
                <th scope="col" class="num">構成比</th>
                <th scope="col"><span class="visually-hidden">操作</span></th>
              </tr>
            </thead>
            <tbody>
              <template data-wcs="for: expenses">
                <tr>
                  <td><input type="text" aria-label="経費の科目" data-wcs="value: .label"></td>
                  <td class="num"><input type="number" min="0" step="1" aria-label="経費の金額" data-wcs="value|number: .amount"></td>
                  <td class="num" data-wcs="textContent: .share|percent(1)"></td>
                  <td><button type="button" data-wcs="onclick: removeExpense">削除</button></td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <th scope="row">合計</th>
                <td class="num"><span id="expense-total" data-wcs="textContent: expenseTotal|locale"></span> 円</td>
                <td></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <button type="button" class="add-row" data-wcs="onclick: addExpense">経費の行を追加</button>
      </section>
    </main>

    <aside class="card result" aria-labelledby="result-title">
      <h2 id="result-title">合計</h2>
      <dl>
        <dt>収入金額</dt>
        <dd><span data-wcs="textContent: incomeTotal|locale"></span> 円</dd>
        <dt>必要経費</dt>
        <dd><span data-wcs="textContent: expenseTotal|locale"></span> 円</dd>
        <dt>差引金額</dt>
        <dd><span id="profit" data-wcs="textContent: profit|locale; class.loss: profit|lt(0)"></span> 円</dd>
      </dl>
    </aside>
  </div>
</div>

</body>
</html>
