<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>収支</title>
  <style>
    body { margin: 24px; font-family: system-ui, sans-serif; }
    table { border-collapse: collapse; }
    th, td { padding: 8px 16px; border-bottom: 1px solid #ccc; }
    th { text-align: left; font-weight: normal; }
    td { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<h1>収支</h1>

<table>
  <tbody>
    <tr><th scope="row">収入金額</th><td>5,000,000 円</td></tr>
    <tr><th scope="row">必要経費</th><td>1,200,000 円</td></tr>
    <tr><th scope="row">差引金額</th><td>3,800,000 円</td></tr>
  </tbody>
</table>

</body>
</html>
